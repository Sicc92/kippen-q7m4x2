<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zigarettenautomaten-Finder</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#eef1f4;--card:#fff;--text:#14202b;--muted:#5b6875;--line:#d5dce3;--accent:#1d3557;--on:#fff;--m:#d6224a;--s:#0e7490}
@media (prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#17212c;--text:#e8eef4;--muted:#98a6b4;--line:#2a3846;--accent:#7dd3fc;--on:#0b1620;--m:#ff6b8a;--s:#4cc3de}}
*{box-sizing:border-box}[hidden]{display:none!important}
html{overflow-x:hidden;overscroll-behavior-x:none}
body{overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y;width:100%;position:relative;margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{max-width:820px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:16px 14px 10px}
h1{font-size:1.3rem;margin:0;font-weight:800;letter-spacing:-.02em}
main{max-width:820px;margin:0 auto;padding:0 14px 24px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search],input[type=text],select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;max-width:100%}
#q{flex:1;min-width:160px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:9px 13px}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:700}
button:disabled{opacity:.55;cursor:default}
.lang{display:flex;gap:4px}.lang button{padding:5px 10px;font-weight:700}
.lang button[aria-pressed=true]{background:var(--accent);color:var(--on);border-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg label{position:relative;flex:1}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:block;text-align:center;padding:9px 8px;font-size:.95rem}
.seg input:checked+span{background:var(--accent);color:var(--on);font-weight:700}
.seg input:focus-visible+span{outline:2px solid var(--text);outline-offset:-3px}
#status{margin:10px 2px;color:var(--muted);min-height:1.4em}#status.err{color:var(--m);font-weight:600}
#banner{background:var(--accent);color:var(--on);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#banner span{flex:1;min-width:180px;font-weight:600}
.pp{min-width:200px}
.pp .photos{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;color:#555;font-size:.85rem}
.pp .photos img{width:72px;height:72px;object-fit:cover;border-radius:8px;cursor:pointer}
.pp button{font-size:.85rem;padding:5px 10px;border-radius:8px}
.pp small{display:block;color:#666;margin-top:6px}
.pp .pmsg{font-weight:600;font-size:.85rem;margin-top:6px;color:#14202b}
#photoDlg{padding:0;width:auto;max-width:96vw;overflow:hidden}
#photoDlg img{display:block;max-width:92vw;max-height:78vh}
#photoDlg .row{padding:10px}
#map.leaflet-container{touch-action:pan-y!important}
.twoHint{position:absolute;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);color:#fff;font-weight:600;text-align:center;padding:16px;pointer-events:none;opacity:0;transition:opacity .25s}
.twoHint.on{opacity:1}
#map{height:46vh;min-height:300px;border-radius:14px;border:1px solid var(--line);margin-bottom:10px;z-index:0}
.legend{display:flex;gap:14px;color:var(--muted);font-size:.9rem;margin-bottom:12px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
#list{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}
#list li{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--s);border-radius:12px;padding:10px 12px;display:grid;gap:3px}
#list li.m{border-left-color:var(--m)}
.name{font-weight:700;cursor:pointer}
.meta{color:var(--muted);font-size:.9rem}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px}
.acts a,.acts button{font-size:.85rem;padding:5px 10px;border-radius:8px;border:1px solid var(--line);color:var(--text);text-decoration:none;background:var(--bg)}
.vote{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.vote button{font-size:.85rem;padding:5px 10px;border-radius:8px}
.vote .ok{border-color:#2b8a3e}.vote .bad{border-color:var(--m)}
.vote small{color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);padding:18px;width:min(92vw,440px)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 10px;font-size:1.15rem}
dialog label{display:block;margin:10px 0 4px;font-weight:600;font-size:.92rem}
dialog textarea,dialog select{width:100%}
.hint{color:var(--muted);font-size:.85rem;margin:10px 0}
#dMsg{margin:10px 0;font-weight:600}
footer{max-width:820px;margin:0 auto;padding:0 14px 28px;color:var(--muted);font-size:.82rem}
footer a{color:inherit}
</style>
</head>
<body>
<header>
  <h1 data-i18n="title"></h1>
  <div style="display:flex;gap:8px;align-items:center"><button id="signOut" hidden data-i18n="signOut"></button><div class="lang"><button data-l="de" aria-label="Deutsch">DE</button><button data-l="en" aria-label="English">EN</button></div></div>
</header>
<section id="gate" class="panel" style="width:calc(100% - 28px);max-width:420px;margin:30px auto;padding:20px" hidden>
  <p data-i18n="gateText" style="margin:0"></p>
  <div class="row"><input type="text" id="codeIn" data-ph="codePh" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="flex:1;min-width:160px"><button id="signIn" class="primary" data-i18n="signIn"></button></div>
  <div id="gateMsg" role="status" style="color:var(--m);font-weight:600"></div>
</section>
<main id="app" hidden>
  <section class="panel">
    <div class="row">
      <input type="search" id="q" data-ph="search" autocomplete="off">
      <button id="go" data-i18n="searchBtn"></button>
      <button id="loc" class="primary">📍 <span data-i18n="mypos"></span></button>
    </div>
    <div class="row">
      <label for="rad" data-i18n="radius"></label>
      <select id="rad"><option value="500">500 m</option><option value="1000">1 km</option><option value="2000" selected>2 km</option><option value="5000">5 km</option><option value="10000">10 km</option></select>
    </div>
    <div class="seg">
      <label><input type="radio" name="f" value="all" checked><span data-i18n="fAll"></span></label>
      <label><input type="radio" name="f" value="m"><span data-i18n="fM"></span></label>
      <label><input type="radio" name="f" value="s"><span data-i18n="fS"></span></label>
    </div>
  </section>
  <div id="status" role="status"></div>
  <div id="banner" hidden><span data-i18n="pick"></span><button id="here" data-i18n="here"></button><button id="pickCancel" data-i18n="cancel"></button></div>
  <div id="map"></div>
  <div class="legend"><span><i class="dot" style="background:var(--m)"></i><span data-i18n="lm"></span></span><span><i class="dot" style="background:var(--s)"></i><span data-i18n="ls"></span></span><span><i class="dot" style="background:#ffd6df;border:2px solid var(--m);box-sizing:border-box"></i><span data-i18n="lc"></span></span></div>
  <button id="new" class="primary" data-i18n="newBtn"></button>
  <div id="nearest" class="panel" style="margin-top:10px" hidden></div>
  <ul id="list"></ul>
</main>
<dialog id="dlg">
  <h2 id="dTitle"></h2>
  <label for="cm" id="cmLabel" data-i18n="comment"></label>
  <textarea id="cm" rows="3"></textarea>
  <p class="hint" data-i18n="privacy"></p>
  <div id="dMsg" aria-live="polite"></div>
  <div class="row"><button id="sendBtn" class="primary" data-i18n="send"></button><button id="dClose" data-i18n="cancel"></button></div>
</dialog>
<footer><span data-i18n="attr"></span> © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> (ODbL) · CARTO / Esri · Overpass API · Nominatim</footer>

<dialog id="photoDlg"><img id="photoBig" alt=""><div class="row"><button id="photoClose" data-i18n="close"></button></div></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script>
const I={

en:{title:"Cigarette Vending Machine Finder",search:"Place or address",searchBtn:"Search",mypos:"My location",radius:"Radius",fAll:"Both",fM:"Machines only",fS:"Stores only",lm:"Machine",ls:"Store",sTob:"Tobacco shop",sKiosk:"Kiosk",newBtn:"+ Report a new machine",pick:"Tap the map where the machine is.",here:"My location",cancel:"Cancel",start:"Tap “My location” or enter a place.",loading:"Searching …",none:"Nothing found. Increase the radius or change the filter.",found:"{n} results, sorted by distance",errNet:"Request failed. Please try again later.",showPhotos:"📷 Show photos",photos:"Photo",addPhoto:"📷 Add photo",noPhotos:"No photos yet.",photoLoading:"Loading photos …",photoSending:"Uploading photo …",photoThanks:"Thanks! The photo was added.",photoErr:"Photo could not be loaded or uploaded.",photoLimit:"You already uploaded 3 photos today.",photoBad:"Please choose an image.",photoRule:"Please do not photograph people or license plates.",close:"Close",errGeo:"Location unavailable. Enter a place instead.",errPlace:"Place not found.",report:"Report: broken / gone",rTitleNew:"Report a new machine",rTitleOld:"Report a problem",reason:"What is the problem?",rBroken:"Does not work",rGone:"No longer exists",rOther:"Other problem",comment:"Comment (optional)",commentNew:"Description, e.g. exact spot or operator (optional)",send:"Send report",sending:"Sending …",sent:"Thanks! The machine was reported and now shows up in the app.",sendErr:"Sending failed.",limit:"You already reported 3 machines today.",lc:"Machine (community)",privacy:"Reports are anonymous but visible to all users of the app. Please only report real machines.",unnamed:"Unnamed",attr:"Data:",hours:"Opening hours",nearest:"Nearest machine",navTo:"Route with",voteOk:"👍 Works",voteBad:"👎 Broken / gone",votedThanks:"Thanks for your rating!",votedAlready:"You already rated this machine today.",voteErr:"Rating failed.",last:"Last rated",noVotes:"No ratings yet",partial:"{n} results so far, still searching …",bigHint:"Large radii can take longer.",gateText:"This app is invite-only. Please enter the access code.",codePh:"Access code",signIn:"Continue",signOut:"Sign out",denied:"The code is not valid.",authErr:"Check failed."}
};
const $=s=>document.querySelector(s);
let lang=(()=>{try{const s=localStorage.getItem("lang");if(s)return s}catch(e){}return (navigator.language||"de").startsWith("de")?"de":"en"})();
const t=k=>I[lang][k]||k;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let st={k:"start",n:0,err:false},pos=null,me=null,items=[],pick=false,rep=null;

const map=L.map("map").setView([51.16,10.45],6);
/* Touch-Geräte: Karte nur mit zwei Fingern bedienen, ein Finger scrollt die Seite */
if(L.Browser.touch&&window.matchMedia("(pointer:coarse)").matches){
  const box=map.getContainer(),hint=document.createElement("div");
  hint.className="twoHint";box.appendChild(hint);
  let ht;
  const showHint=()=>{hint.textContent=lang==="de"?"Mit zwei Fingern bewegen":"Use two fingers to move the map";hint.classList.add("on");clearTimeout(ht);ht=setTimeout(()=>hint.classList.remove("on"),1200)};
  box.addEventListener("touchstart",e=>{
    if(e.touches.length<2){e.stopPropagation();showHint()}else{hint.classList.remove("on")}
  },{capture:true,passive:true});
  box.addEventListener("touchmove",e=>{if(e.touches.length>=2&&e.cancelable)e.preventDefault()},{capture:true,passive:false});
}

const tl=L.tileLayer("https://{s}.basemaps.cartocdn.com/rasterTiles/voyager/{z}/{x}/{y}{r}.png",{subdomains:"abcd",maxZoom:19,attribution:"© OpenStreetMap contributors © CARTO"}).addTo(map);
let tlFallback=false;
tl.on("tileerror",()=>{if(tlFallback)return;tlFallback=true;map.removeLayer(tl);L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Tiles © Esri, © OpenStreetMap contributors"}).addTo(map)});
const layer=L.layerGroup().addTo(map);

function setStatus(k,n=0,err=false){st={k,n,err};const e=$("#status");e.textContent=t(k).replace("{n}",n);e.className=err?"err":""}
function applyLang(){
  document.documentElement.lang=lang;document.title=t("title");
  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  setStatus(st.k,st.n,st.err);render();
  if($("#dlg").open){$("#dTitle").textContent=t(rep.item?"rTitleOld":"rTitleNew");$("#cm").placeholder=t(rep.item?"comment":"commentNew")}
}
function dist(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180,p=r(c-a),q=r(d-b);const h=Math.sin(p/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(q/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const fmt=d=>d<1000?Math.round(d)+" m":(d/1000).toLocaleString(lang,{maximumFractionDigits:1})+" km";

function setPos(lat,lon){
  pos={lat,lon};
  if(me)me.remove();
  me=L.circleMarker([lat,lon],{radius:8,color:"#fff",weight:3,fillColor:"#2b8a3e",fillOpacity:1}).addTo(map);
  load();
}
function fit(){const r=+$("#rad").value;map.fitBounds(L.latLng(pos.lat,pos.lon).toBounds(r*2.2))}
function geoHint(g){
  const de=lang==="de";
  if(g&&g.code===1)return de?"Standort verweigert. Chrome: Schloss in der Adressleiste → Berechtigungen → Standort → Zulassen. Außerdem Handy-Einstellungen → Standort einschalten."
                             :"Location denied. Chrome: lock icon in the address bar → Permissions → Location → Allow. Also turn on location in the phone settings.";
  if(g&&g.code===3)return de?"Zeitüberschreitung beim Standort. Standort am Handy einschalten, ins Freie gehen und erneut tippen.":"Location timed out. Turn on location on the phone, go outside and try again.";
  return de?"Standort nicht verfügbar. Standort am Handy einschalten und die Seite in Chrome oder Safari (nicht in einer Messenger-App) öffnen.":"Location unavailable. Turn on location on the phone and open the page in Chrome or Safari (not inside a messenger app).";
}
function locate(){
  const fail=g=>{setStatus("errGeo",0,true);$("#status").textContent=geoHint(g)+(location.protocol==="file:"?" (file://)":"")};
  if(!navigator.geolocation)return fail(null);
  setStatus("loading");
  const ok=p=>setPos(p.coords.latitude,p.coords.longitude);
  navigator.geolocation.getCurrentPosition(ok,g=>{
    if(g&&g.code===1)return fail(g);
    navigator.geolocation.getCurrentPosition(ok,fail,{enableHighAccuracy:false,timeout:15000,maximumAge:600000});
  },{enableHighAccuracy:true,timeout:8000});
}
async function search(){
  const q=$("#q").value.trim();if(!q)return;
  setStatus("loading");
  try{
    const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(q));
    if(!r.ok)throw new Error("Nominatim HTTP "+r.status);
    const j=await r.json();
    if(!j.length)return setStatus("errPlace",0,true);
    setPos(+j[0].lat,+j[0].lon);
  }catch(e){setStatus("errNet",0,true);$("#status").textContent+=" ["+(e&&e.errors?e.errors.map(x=>x.message).join(", "):(e&&e.message||e))+"]"}
}
/* Suche: Automaten und Geschäfte getrennt, drei Overpass-Server im Wettlauf, Zwischenspeicher (24 h) */
const EP=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://overpass.private.coffee/api/interpreter"];
const TTL=864e5;
let loadSeq=0,parts={},pending=0;
function overpass1(q){
  const body="data="+encodeURIComponent(`[out:json][timeout:20];(${q});out center tags qt;`);
  const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),22000);
  return Promise.any(EP.map(async u=>{
    const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body,signal:ctl.signal});
    if(!r.ok)throw new Error(new URL(u).host+" HTTP "+r.status);
    return r.json();
  })).finally(()=>{clearTimeout(timer);ctl.abort()});
}
/* bei 502/504 oder Zeitüberschreitung bis zu zweimal neu versuchen */
async function overpass(q){
  let err;
  for(let i=0;i<3;i++){
    try{return await overpass1(q)}catch(e){err=e;if(i<2)await new Promise(r=>setTimeout(r,1500*(i+1)))}
  }
  throw err;
}
const ckey=(k,r)=>`ov:${k}:${pos.lat.toFixed(3)},${pos.lon.toFixed(3)}:${r}`;
function cget(key){try{const o=JSON.parse(localStorage.getItem(key)||"null");return o&&Date.now()-o.t<TTL?o.j:null}catch(e){return null}}
function cset(key,j){try{localStorage.setItem(key,JSON.stringify({t:Date.now(),j}))}catch(e){}}
function mapEls(j){
  return ((j&&j.elements)||[]).map(e=>{
    const tg=e.tags||{},la=e.lat??(e.center&&e.center.lat),lo=e.lon??(e.center&&e.center.lon);
    if(la==null)return null;
    return{id:e.type+"/"+e.id,lat:la,lon:lo,tg,m:tg.amenity==="vending_machine"||/cigarette|tobacco/.test(tg.vending||""),d:dist(pos.lat,pos.lon,la,lo)};
  }).filter(Boolean);
}
function apply(seq){
  if(seq!==loadSeq)return;
  const seen=new Set(),osm=[];
  [].concat(parts.m||[],parts.s||[]).forEach(i=>{if(!seen.has(i.id)){seen.add(i.id);osm.push(i)}});
  items=osm.concat(items.filter(i=>i.c)).sort((x,y)=>x.d-y.d);
  render();
  if(pending>0)setStatus("partial",items.length);
}
async function load(){
  if(!pos)return;
  const seq=++loadSeq;
  const f=document.querySelector("input[name=f]:checked").value,r=+$("#rad").value;
  const a=`(around:${r},${pos.lat},${pos.lon})`;
  const jobs=[];
  if(f!=="s")jobs.push(["m",`nwr["vending"~"cigarette"]${a};nwr["amenity"="vending_machine"]["vending"~"tobacco"]${a};`]);
  if(f!=="m")jobs.push(["s",`nwr["shop"~"^(tobacco|kiosk)$"]${a};`]);
  parts={};pending=jobs.length;items=[];
  setStatus("loading");if(r>=5000)$("#status").textContent+=" "+t("bigHint");
  fit();render();
  enrich(f,r);
  const errs=[];
  await Promise.all(jobs.map(async([k,q])=>{
    const key=ckey(k,r),c=cget(key);
    if(c&&seq===loadSeq){parts[k]=mapEls(c);apply(seq)}
    try{
      const j=await overpass(q);
      cset(key,j);
      if(seq!==loadSeq)return;
      pending--;parts[k]=mapEls(j);apply(seq);
    }catch(e){
      if(seq!==loadSeq)return;
      pending--;
      if(!c)errs.push(e);
    }
  }));
  if(seq!==loadSeq)return;
  pending=0;apply(seq);
  setStatus(items.length?"found":"none",items.length);
  await loadVotes();
  if(seq!==loadSeq)return;
  render();
  if(errs.length){
    const e=errs[0];
    setStatus("errNet",0,true);
    $("#status").textContent+=" ["+(e&&e.errors?e.errors.map(x=>x.message).join(", "):(e&&e.message||e))+"]";
  }
}

let db=null,votes={};

try{if(typeof firebase!=="undefined"){firebase.initializeApp(FB);db=firebase.firestore()}}catch(e){db=null}
const vid=it=>it.id.replace("/","_");
async function loadVotes(){
  votes={};if(!db)return;
  items.filter(i=>i.c).forEach(i=>votes[vid(i)]=i.data);
  const ids=items.filter(i=>i.m&&!i.c).map(vid);
  for(let k=0;k<ids.length;k+=10){
    try{const s=await col("machines").where(firebase.firestore.FieldPath.documentId(),"in",ids.slice(k,k+10)).get();s.forEach(d=>votes[d.id]=d.data())}catch(e){return}
  }
}
/* von der Community gemeldete Automaten laden und mit den OSM-Treffern zusammenführen */
async function enrich(f,r){
  if(!db||!pos)return;
  if(f!=="s"){
    try{
      const dLat=r/111320;
      const s=await col("community").where("lat",">=",pos.lat-dLat).where("lat","<=",pos.lat+dLat).get();
      const c=[];
      s.forEach(d=>{
        const x=d.data();
        if(typeof x.lat!=="number"||typeof x.lon!=="number")return;
        const dd=dist(pos.lat,pos.lon,x.lat,x.lon);
        if(dd>r)return;
        c.push({id:"c/"+d.id,docId:d.id,c:true,lat:x.lat,lon:x.lon,tg:{},note:x.note||"",m:true,d:dd,data:x});
      });
      items=items.filter(i=>!i.c).concat(c).sort((a,b)=>a.d-b.d);
    }catch(e){}
  }
  await loadVotes();render();
}
function voteRow(it,i){
  const v=votes[vid(it)]||{ok:0,bad:0};
  const when=v.last&&v.last.toDate?`${t("last")}: ${v.last.toDate().toLocaleDateString(lang)}`:"";
  const info=[v.ok||v.bad?"":t("noVotes"),when].filter(Boolean).join(" · ");
  return `<span class="vote"><button class="ok" data-v="ok" data-vi="${i}">${t("voteOk")} (${v.ok||0})</button><button class="bad" data-v="bad" data-vi="${i}">${t("voteBad")} (${v.bad||0})</button><small>${esc(info)}</small></span>`;
}
async function vote(it,type){
  const id=vid(it),key="vote:"+id,today=new Date().toISOString().slice(0,10);
  try{if(localStorage.getItem(key)===today){setStatus("votedAlready");return}}catch(e){}
  const ref=col(it.c?"community":"machines").doc(it.c?it.docId:id),F=firebase.firestore.FieldValue;
  try{
    const snap=await ref.get();
    if(snap.exists)await ref.update({[type]:F.increment(1),last:F.serverTimestamp(),lastType:type});
    else if(!it.c)await ref.set({ok:type==="ok"?1:0,bad:type==="bad"?1:0,last:F.serverTimestamp(),lastType:type});
    if(it.c)it.data=(await ref.get()).data();
    try{localStorage.setItem(key,today)}catch(e){}
    setStatus("votedThanks");await loadVotes();render();
  }catch(e){setStatus("voteErr",0,true);$("#status").textContent+=" ["+(e.code||e.message)+"]"}
}
/* Fotos: werden verkleinert und als JPEG-Text in Firestore gespeichert (Firebase Storage braucht den bezahlten Tarif) */
const photoCache={},JPEG="data:image/jpeg;base64,";
function compress(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let max=640,q=.7;
      for(let n=0;n<10;n++){
        const s=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        const out=c.toDataURL("image/jpeg",q);
        if(out.startsWith(JPEG)&&out.length<=60000)return res(out);
        if(q>.45)q-=.1;else max=Math.round(max*.8);
      }
      rej(new Error("too-large"));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("bad-image"))};
    img.src=url;
  });
}
async function getPhotos(it,force){
  const id=vid(it);
  if(!force&&photoCache[id])return photoCache[id];
  const s=await col("photos").where("machine","==",id).limit(3).get();
  const a=[];
  s.forEach(d=>{const x=d.data();if(typeof x.data==="string"&&x.data.startsWith(JPEG))a.push({src:x.data,t:x.created&&x.created.toMillis?x.created.toMillis():0})});
  a.sort((p,q)=>q.t-p.t);
  return photoCache[id]=a;
}
function openPhoto(src){$("#photoBig").src=src;$("#photoDlg").showModal()}
function popupNode(it,name){
  const box=document.createElement("div");box.className="pp";
  const h=document.createElement("b");h.textContent=name;
  const dd=document.createElement("div");dd.textContent=fmt(it.d);
  box.append(h,dd);
  if(!(it.m&&db&&CODE))return box;
  const ph=document.createElement("div");ph.className="photos";
  const msg=document.createElement("div");msg.className="pmsg";
  const btn=document.createElement("button");btn.type="button";btn.textContent=t("addPhoto");
  const inp=document.createElement("input");inp.type="file";inp.accept="image/*";inp.hidden=true;
  const rule=document.createElement("small");rule.textContent=t("photoRule");
  const refresh=()=>{try{it.marker.getPopup().update()}catch(e){}};
  const show=async force=>{
    ph.textContent=t("photoLoading");
    try{
      const a=await getPhotos(it,force);
      ph.textContent="";
      if(!a.length)ph.textContent=t("noPhotos");
      a.slice(0,3).forEach(p=>{const im=new Image();im.src=p.src;im.alt=t("photos");im.onclick=()=>openPhoto(p.src);im.onload=refresh;ph.appendChild(im)});
    }catch(e){ph.textContent=t("photoErr")+" ["+(e.code||e.message)+"]"}
    refresh();
  };
  btn.onclick=()=>inp.click();
  inp.onchange=async()=>{
    const f=inp.files&&inp.files[0];inp.value="";if(!f)return;
    if(f.type&&!/^image\//.test(f.type)){msg.textContent=t("photoBad");return}
    const key="photos:"+new Date().toISOString().slice(0,10);
    try{if((+localStorage.getItem(key)||0)>=3){msg.textContent=t("photoLimit");return}}catch(e){}
    btn.disabled=true;msg.textContent=t("photoSending");
    try{
      const data=await compress(f);
      await col("photos").add({machine:vid(it),data,created:firebase.firestore.FieldValue.serverTimestamp()});
      try{localStorage.setItem(key,String((+localStorage.getItem(key)||0)+1))}catch(e){}
      msg.textContent=t("photoThanks");
      await show(true);
    }catch(e){msg.textContent=t("photoErr")+" ["+(e.code||e.message)+"]"}
    btn.disabled=false;refresh();
  };
  const sb=document.createElement("button");sb.type="button";sb.textContent=t("showPhotos");
  sb.onclick=()=>{sb.remove();show(false)};
  box.append(ph,sb,btn,inp,msg,rule);
  return box;
}
function nearestBox(){
  const n=$("#nearest"),nm=pos&&items.find(i=>i.m);
  if(!nm){n.hidden=true;return}

function render(){
  layer.clearLayers();const ul=$("#list");ul.innerHTML="";

      <span class="meta">${t(it.m?"lm":"ls")} · ${fmt(it.d)}${it.c&&it.note?" · "+esc(it.note):""}${it.tg.opening_hours?` · ${t("hours")}: ${esc(it.tg.opening_hours)}`:""}</span>
      <span class="acts"><a href="https://www.google.com/maps/dir/?api=1&destination=${it.lat},${it.lon}" target="_blank" rel="noopener">Google Maps</a><a href="https://maps.apple.com/?daddr=${it.lat},${it.lon}" target="_blank" rel="noopener">Apple Maps</a></span>${it.m&&db?voteRow(it,i):""}`;
    ul.appendChild(li);

  if(st.k==="loading"||st.k==="found"||st.k==="none")setStatus(items.length?"found":"none",items.length);
}

/* Zugangscode: Die App wird erst nach Eingabe des Codes sichtbar.
   Der eigentliche Schutz liegt in den Firestore-Regeln: Die Daten liegen unter /g/<code>/...
   und nur der in den Regeln eingetragene Code hat Zugriff. */
function showGate(k){
  $("#gateMsg").textContent=k?t(k):"";
  $("#gate").hidden=false;$("#app").hidden=true;$("#signOut").hidden=true;
}
async function tryCode(c){
  c=(c||"").trim();
  if(c.length<8||/[\/\s]/.test(c)||c==="."||c===".."){showGate("denied");return false}
  CODE=c;
  try{await col("community").limit(1).get()}
  catch(e){
    CODE="";
    showGate(e.code==="permission-denied"?"denied":"authErr");
    if(e.code!=="permission-denied")$("#gateMsg").textContent+=" ["+(e.code||e.message)+"]";
    return false;
  }
  try{localStorage.setItem("code",c)}catch(e){}
  $("#gate").hidden=true;$("#app").hidden=false;$("#signOut").hidden=false;map.invalidateSize();
  return true;
}
function initGate(){
  if(!db){$("#app").hidden=false;return}
  $("#signIn").onclick=()=>tryCode($("#codeIn").value);
  $("#codeIn").addEventListener("keydown",e=>{if(e.key==="Enter")tryCode($("#codeIn").value)});
$("#photoClose").onclick=()=>$("#photoDlg").close();
$("#photoDlg").addEventListener("click",e=>{if(e.target===$("#photoDlg"))$("#photoDlg").close()});
  $("#signOut").onclick=()=>{try{localStorage.removeItem("code")}catch(e){}CODE="";items=[];votes={};for(const k in photoCache)delete photoCache[k];render();$("#codeIn").value="";showGate()};
  let saved="";try{saved=localStorage.getItem("code")||""}catch(e){}
  if(saved)tryCode(saved).then(ok=>{if(!ok){try{localStorage.removeItem("code")}catch(e){}}});
  else showGate();
}
initGate();
